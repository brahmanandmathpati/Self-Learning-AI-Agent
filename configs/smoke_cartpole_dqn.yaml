# Tiny DQN run for smoke tests and a quick demo (a few seconds on CPU). Not for results.
env_name: CartPole-v1
agent: dqn
episodes: 30
seed: 0
gamma: 0.99
learning_rate: 0.0005
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 2000
max_steps_per_episode: 200
max_wall_clock_s: 120
eval_every: 10
eval_episodes: 3
checkpoint_every: 10
run_root: runs
dqn:
  hidden_size: 64
  batch_size: 32
  buffer_size: 5000
  learning_starts: 200
  target_update_every: 100
