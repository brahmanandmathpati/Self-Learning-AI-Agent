# Tabular Expected SARSA on FrozenLake 4x4 (deterministic map). Same settings as Q-learning for a fair comparison.
env_name: FrozenLake-v1
env_kwargs:
  map_name: 4x4
  is_slippery: false
agent: expected_sarsa
episodes: 2000
seed: 0
gamma: 0.99
learning_rate: 0.1          # alpha in the Expected SARSA update
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 10000  # environment steps
max_steps_per_episode: 100
max_wall_clock_s: 600
eval_every: 100
eval_episodes: 20
checkpoint_every: 500
run_root: runs
