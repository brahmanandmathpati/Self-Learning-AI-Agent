<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 298" width="650" height="298" font-family="Inter, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A9832F"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBF6EC"/></linearGradient></defs><rect width="650" height="298" fill="#FFFFFF"/><rect x="20" y="40" width="150" height="70" rx="12" fill="url(#g)" stroke="#D9CBA3" stroke-width="1.4"/><text x="95.0" y="59.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">State</text><text x="95.0" y="76.0" text-anchor="middle" font-size="10.5" fill="#475569">4 numbers: cart position,</text><text x="95.0" y="90.0" text-anchor="middle" font-size="10.5" fill="#475569">speed, pole angle, spin</text><rect x="210" y="30" width="230" height="90" rx="12" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/><text x="325.0" y="59.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Online network</text><text x="325.0" y="76.0" text-anchor="middle" font-size="10.5" fill="#475569">4 → 128 → 128 → 2</text><text x="325.0" y="90.0" text-anchor="middle" font-size="10.5" fill="#475569">(ReLU) one Q-value per action</text><rect x="480" y="40" width="150" height="70" rx="12" fill="url(#g)" stroke="#D9CBA3" stroke-width="1.4"/><text x="555.0" y="59.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Action</text><text x="555.0" y="76.0" text-anchor="middle" font-size="10.5" fill="#475569">push left / right</text><text x="555.0" y="90.0" text-anchor="middle" font-size="10.5" fill="#475569">(ε-greedy)</text><rect x="210" y="180" width="230" height="70" rx="12" fill="url(#g)" stroke="#D9CBA3" stroke-width="1.4"/><text x="325.0" y="199.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Replay memory</text><text x="325.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#475569">last 50,000 steps ·</text><text x="325.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#475569">random batches of 64</text><rect x="480" y="180" width="150" height="70" rx="12" fill="url(#g)" stroke="#D9CBA3" stroke-width="1.4"/><text x="555.0" y="199.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Target network</text><text x="555.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#475569">copy of online net,</text><text x="555.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#475569">synced every 500 steps</text><rect x="20" y="180" width="150" height="70" rx="12" fill="#FFFBF2" stroke="#C9A24B" stroke-width="1.4"/><text x="95.0" y="199.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Huber loss</text><text x="95.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#475569">Q(s,a) vs</text><text x="95.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#475569">r + γ · max Q_target(s′)</text><line x1="170" y1="75" x2="210" y2="75" stroke="#A9832F" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="75" x2="480" y2="75" stroke="#A9832F" stroke-width="1.6" marker-end="url(#a)"/><line x1="555" y1="110" x2="555" y2="180" stroke="#A9832F" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="561.0" y="141.0" font-size="10" fill="#64748B">copy</text><line x1="325" y1="120" x2="325" y2="180" stroke="#A9832F" stroke-width="1.6" marker-end="url(#a)"/><text x="331.0" y="146.0" font-size="10" fill="#64748B">store (s, a, r, s′)</text><line x1="210" y1="215" x2="170" y2="215" stroke="#A9832F" stroke-width="1.6" marker-end="url(#a)"/><text x="196.0" y="211.0" font-size="10" fill="#64748B">batch</text><path d="M555,250 V272 H95 V252" fill="none" stroke="#A9832F" stroke-width="1.6" marker-end="url(#a)"/><text x="330" y="286" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">target value from