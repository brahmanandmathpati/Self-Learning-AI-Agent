[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-learning-agent"
version = "0.1.0"
description = "A from-scratch DQN agent that learns CartPole, with multi-seed evaluation and LLM reflection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "gymnasium",
    "torch",
    "pyyaml",
    "matplotlib",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sla = "sla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: short DQN smoke run"]
