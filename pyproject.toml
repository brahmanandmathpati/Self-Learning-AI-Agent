[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-learning-agent"
version = "0.2.0"
description = "A self-learning RL agent: tabular Q-learning and a from-scratch DQN, with rigorous evaluation, SQLite experiment tracking, grounded reflection and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Brahmanand Mathpati" },
  { name = "Atharv Gundale" },
  { name = "Vedant Biradar" },
  { name = "Somesh Badwane" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "gymnasium>=1.0",
  "torch>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "streamlit>=1.36",
  "requests>=2.31",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
sla = "sla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: short end-to-end training runs (seconds)",
  "slow: longer learning checks, excluded from CI",
  "torch: needs PyTorch (skipped automatically if it is not installed)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]
