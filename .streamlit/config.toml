[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B0D14"
secondaryBackgroundColor = "#121624"
textColor = "#E6E9F2"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Keep the header clean so the Log in / Sign up corner has room (hides the developer "Deploy" button).
toolbarMode = "minimal"
