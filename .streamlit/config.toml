[theme]
base = "light"
primaryColor = "#4632C9"
backgroundColor = "#F9F6FA"
secondaryBackgroundColor = "#F1EBF6"
textColor = "#040207"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Keep the header clean so the Log in / Sign up corner has room (hides the developer "Deploy" button).
toolbarMode = "minimal"
