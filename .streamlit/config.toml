[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F4EFE6"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Keep the header clean so the Log in / Sign up corner has room (hides the developer "Deploy" button).
toolbarMode = "minimal"
